; Game.ini — RPG Maker game metadata
;
; mkxp-rs reads only [Game]/Title and [Game]/Scripts. The Library and RTP
; fields are reserved by the RPG Maker editor and ignored at runtime.
;
; mkxp-z behaviour: RGSS version is detected from the Scripts file extension
; (.rxdata → XP, .rvdata → VX, .rvdata2 → VX Ace), not from Library.

[Game]
; Window title used when mkxp.ron's window.title is empty.
Title=My RPG Game

; Path to the Ruby scripts archive.
; RGSS1 (XP):      Data\Scripts.rxdata
; RGSS2 (VX):      Data\Scripts.rvdata
; RGSS3 (VX Ace):  Data\Scripts.rvdata
Scripts=Data\Scripts.rvdata

; Reserved — the original RGSS DLL name. Ignored at runtime by both mkxp-z
; and mkxp-rs (version is detected from Scripts extension).
Library=RGSS300.dll

; Reserved — standard RTP package name. Ignored at runtime (RTP paths are
; configured in mkxp.ron's paths.rtp).
RTP=Standard
